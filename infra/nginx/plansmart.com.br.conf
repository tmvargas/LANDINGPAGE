server {
    listen 80;
    listen [::]:80;
    server_name plansmart.com.br www.plansmart.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name plansmart.com.br www.plansmart.com.br;

    ssl_certificate /etc/letsencrypt/live/plansmart.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plansmart.com.br/privkey.pem;

    root /opt/plansmart/sistemas/landingpage;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
